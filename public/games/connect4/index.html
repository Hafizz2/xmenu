<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Connect Four</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
.c4{--cell:min(calc((96vw - 44px) / 7),calc((100vh - 320px) / 7),62px);position:relative;padding:10px 10px 12px;border-radius:18px;background:#1F56D6;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.18),0 8px 0 #163FA3,0 18px 30px -12px rgba(20,40,90,.45)}
.c4 .cols{display:grid;grid-template-columns:repeat(7,var(--cell));gap:4px;position:relative}
.col{display:grid;grid-template-rows:repeat(6,var(--cell));gap:4px;border:0;padding:0;background:none;border-radius:calc(var(--cell) / 2)}
.col:active,.col.hover{background:rgba(255,255,255,.1)}
.hole{position:relative;border-radius:50%;background:var(--bg);box-shadow:inset 0 3px 5px rgba(0,0,0,.28)}
.disc{position:absolute;inset:6%;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 0 0 5px rgba(0,0,0,.06)}
.disc::after{content:'';position:absolute;inset:22%;border-radius:50%;box-shadow:inset 0 2px 0 rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.35)}
.disc.p0{background:var(--p1)}
.disc.p1{background:var(--p2)}
.disc.fall{animation:fall var(--t,.4s) cubic-bezier(.5,0,.75,0) both,bounce .22s var(--t,.4s) ease-out}
@keyframes fall{from{transform:translateY(var(--from))}to{transform:translateY(0)}}
@keyframes bounce{40%{transform:translateY(-7%)}100%{transform:none}}
.disc.win{animation:pop .5s ease-out both;box-shadow:0 0 0 3px #fff,inset 0 -4px 0 rgba(0,0,0,.18)}
@keyframes pop{50%{transform:scale(1.12)}}
.ghostrow{display:grid;grid-template-columns:repeat(7,var(--cell));gap:4px;height:calc(var(--cell) * .8);margin:0 10px 8px}
.ghostrow i{border-radius:50%;width:76%;height:auto;aspect-ratio:1;margin:auto;opacity:0;transition:opacity .12s,transform .12s;transform:translateY(-4px)}
.ghostrow i.on{opacity:1;transform:none}
.wrap{display:flex;flex-direction:column;align-items:center}
</style>
</head><body>
<script src="../kit/kit.js"></script>
<script>
(function () {
  var R = 6, C = 7, g, over, moves, t0, colsEl, ghost, busy;
  var kit = XKit({
    id: 'connect4', bg: '#E8EDF4', accent: '#1F56D6', playerColors: ['#E0313A', '#F2B705'],
    icon: '<circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/><circle cx="12" cy="12" r="2.5"/>',
    title: { en: 'Connect Four', am: 'አራት አገናኝ' },
    desc: { en: 'Drop discs and connect four before your opponent does.', am: 'ዲስኮችን ጣሉ እና ከተቃዋሚዎ በፊት አራት ያገናኙ።' },
    rules: {
      en: ['Tap a column to drop your disc. It falls to the lowest free space.', 'Connect four of your discs in a row: across, up and down, or diagonally.', 'Block your opponent when they have three in a line.', 'If the board fills up with no four in a row, it is a draw.'],
      am: ['ዲስክዎን ለመጣል አምዱን ይንኩ። ወደ ታችኛው ባዶ ቦታ ይወድቃል።', 'አራት ዲስኮችዎን በአግድም፣ በቁመት ወይም በሰያፍ ያገናኙ።', 'ተቃዋሚዎ ሶስት ሲያሰልፍ ይዝጉት።', 'ሰሌዳው ሞልቶ አራት ካልተገናኘ አቻ ነው።']
    },
    modes: [{ id: 'ai', label: { en: 'vs Computer', am: 'ከኮምፒውተር' }, ai: true }, { id: 'pvp', label: { en: '2 players', am: '2 ተጫዋቾች' } }],
    defaultTarget: 2,
    newRound: function () {
      g = []; for (var r = 0; r < R; r++) g.push(Array(C).fill(null));
      over = false; moves = 0; t0 = Date.now(); busy = false;
      kit.stage.innerHTML = '';
      var wrap = kit.el('div', 'wrap'), board = kit.el('div', 'c4');
      ghost = kit.el('div', 'ghostrow'); for (var c = 0; c < C; c++) ghost.appendChild(kit.el('i'));
      colsEl = kit.el('div', 'cols');
      for (c = 0; c < C; c++) {
        var col = kit.el('button', 'col'); col.dataset.c = c; col.setAttribute('aria-label', 'Column ' + (c + 1));
        for (r = 0; r < R; r++) col.appendChild(kit.el('div', 'hole'));
        col.onclick = function () { human(+this.dataset.c); };
        col.onmouseenter = function () { showGhost(+this.dataset.c); };
        col.onpointerdown = function () { showGhost(+this.dataset.c); };
        colsEl.appendChild(col);
      }
      colsEl.onmouseleave = function () { showGhost(-1); };
      board.appendChild(colsEl); wrap.appendChild(ghost); wrap.appendChild(board); kit.stage.appendChild(wrap);
      maybeAI();
    }
  });

  function showGhost(c) {
    var p = kit.state.turn;
    Array.prototype.forEach.call(ghost.children, function (i, k) { i.className = (k === c && !over && !kit.state.isAI(p) && g[0][k] === null) ? 'on' : ''; i.style.background = 'var(--p' + (p + 1) + ')'; });
  }
  function human(c) { if (over || busy || kit.state.isAI(kit.state.turn)) return; drop(c); }
  function drop(c) {
    var r = lowest(g, c); if (r < 0) { kit.sound('miss'); return; }
    var p = kit.state.turn; g[r][c] = p; moves++; busy = true;
    var hole = colsEl.children[c].children[r], d = kit.el('div', 'disc p' + p + ' fall');
    var dist = (r + 1) * 1.08; d.style.setProperty('--from', '-' + (r + 1.5) * 124 + '%'); // one row is about 124% of the disc height
    d.style.setProperty('--t', (0.18 + dist * 0.05).toFixed(2) + 's');
    hole.appendChild(d); kit.sound('drop'); showGhost(-1);
    setTimeout(function () {
      busy = false; kit.vibrate(10);
      var w = winLine(g, r, c);
      if (w) { over = true; w.forEach(function (q) { colsEl.children[q[1]].children[q[0]].firstChild.classList.add('win'); }); return end(p); }
      if (g[0].every(function (v) { return v !== null; })) { over = true; return end(-1); }
      kit.setTurn(1 - p); maybeAI();
    }, 380);
  }
  function end(p) {
    var secs = Math.round((Date.now() - t0) / 1000);
    kit.roundEnd(p, { stats: [[kit.lang === 'am' ? 'ዲስኮች' : 'Discs', moves], [kit.lang === 'am' ? 'ጊዜ' : 'Time', Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0')], [kit.lang === 'am' ? 'ዙር' : 'Round', kit.state.round]] });
  }
  function lowest(b, c) { for (var r = R - 1; r >= 0; r--) if (b[r][c] === null) return r; return -1; }
  function winLine(b, r, c) {
    var p = b[r][c], dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var i = 0; i < 4; i++) {
      var d = dirs[i], line = [[r, c]];
      for (var s = -1; s <= 1; s += 2) { var rr = r + d[0] * s, cc = c + d[1] * s; while (rr >= 0 && rr < R && cc >= 0 && cc < C && b[rr][cc] === p) { line.push([rr, cc]); rr += d[0] * s; cc += d[1] * s; } }
      if (line.length >= 4) return line;
    }
    return null;
  }

  // ---------- Computer: alpha-beta search with a window heuristic ----------
  function maybeAI() {
    var S = kit.state; if (over || !S.isAI(S.turn)) return;
    kit.setTurn(S.turn, true);
    var token = S.token;
    setTimeout(function () { if (token !== S.token || over) return; drop(choose()); }, 500 + Math.random() * 300);
  }
  function valid(b) { var v = []; [3, 2, 4, 1, 5, 0, 6].forEach(function (c) { if (b[0][c] === null) v.push(c); }); return v; }
  function choose() {
    var d = kit.state.diff, v = valid(g);
    for (var k = 0; k < v.length; k++) { var r = lowest(g, v[k]); g[r][v[k]] = 1; var w = winLine(g, r, v[k]); g[r][v[k]] = null; if (w) return v[k]; }
    if (d === 'easy') {
      for (k = 0; k < v.length; k++) { r = lowest(g, v[k]); g[r][v[k]] = 0; w = winLine(g, r, v[k]); g[r][v[k]] = null; if (w && Math.random() < .6) return v[k]; }
      return v[Math.floor(Math.random() * v.length)];
    }
    var depth = d === 'hard' ? 6 : 3, best = -Infinity, move = v[0];
    v.forEach(function (c) { var r = lowest(g, c); g[r][c] = 1; var s = ab(g, depth - 1, -Infinity, Infinity, false, r, c); g[r][c] = null; if (s > best) { best = s; move = c; } });
    if (d === 'medium' && Math.random() < .15) move = v[Math.floor(Math.random() * v.length)];
    return move;
  }
  function ab(b, depth, a, beta, maxing, lr, lc) {
    if (winLine(b, lr, lc)) return maxing ? -100000 - depth : 100000 + depth;
    var v = valid(b); if (!v.length) return 0;
    if (depth === 0) return score(b);
    if (maxing) { var best = -Infinity; for (var i = 0; i < v.length; i++) { var r = lowest(b, v[i]); b[r][v[i]] = 1; best = Math.max(best, ab(b, depth - 1, a, beta, false, r, v[i])); b[r][v[i]] = null; a = Math.max(a, best); if (a >= beta) break; } return best; }
    best = Infinity; for (i = 0; i < v.length; i++) { r = lowest(b, v[i]); b[r][v[i]] = 0; best = Math.min(best, ab(b, depth - 1, a, beta, true, r, v[i])); b[r][v[i]] = null; beta = Math.min(beta, best); if (a >= beta) break; } return best;
  }
  function score(b) {
    var s = 0;
    for (var r = 0; r < R; r++) if (b[r][3] === 1) s += 3; else if (b[r][3] === 0) s -= 3;
    function win(cells) { var a = 0, h = 0, e = 0; cells.forEach(function (x) { if (x === 1) a++; else if (x === 0) h++; else e++; });
      if (a && h) return 0; if (a === 3 && e === 1) return 5; if (a === 2 && e === 2) return 2; if (h === 3 && e === 1) return -6; if (h === 2 && e === 2) return -2; return 0; }
    for (r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      if (c + 3 < C) s += win([b[r][c], b[r][c + 1], b[r][c + 2], b[r][c + 3]]);
      if (r + 3 < R) s += win([b[r][c], b[r + 1][c], b[r + 2][c], b[r + 3][c]]);
      if (r + 3 < R && c + 3 < C) s += win([b[r][c], b[r + 1][c + 1], b[r + 2][c + 2], b[r + 3][c + 3]]);
      if (r + 3 < R && c - 3 >= 0) s += win([b[r][c], b[r + 1][c - 1], b[r + 2][c - 2], b[r + 3][c - 3]]);
    }
    return s;
  }
})();
</script>
</body></html>
